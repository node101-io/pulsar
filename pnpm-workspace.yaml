packages:
  - contracts
  - prover
  - bridge
  - chain-client
  - webapp
  - docs

allowBuilds:
  '@bufbuild/buf': true # buf CLI for chain-client proto:gen
  msgpackr-extract: true # bullmq native codec
  protobufjs: true # grpc reflection client
  sharp: true # next/image optimiser (webapp)
  unrs-resolver: true # eslint resolver (webapp)
  esbuild: true # wrangler bundler (webapp)
  workerd: true # local Workers runtime for wrangler dev (webapp)
  # Optional native speedups for ws and secp256k1; the JS fallbacks are
  # correct, and the webapp signs through wallets rather than these.
  bufferutil: false
  utf-8-validate: false
  tiny-secp256k1: false

minimumReleaseAgeExclude:
  - elliptic@6.6.2
  - postcss@8.5.10
  - protobufjs@7.5.5
  - protobufjs@7.5.6
  - protobufjs@7.5.8
  - uuid@11.1.1
  - protobufjs@7.6.1
  - protobufjs@7.6.3
  - brace-expansion@1.1.16
  - protobufjs@7.6.5
  - sharp@0.35.0
  - postcss@8.5.12
  - brace-expansion@1.1.17
  - brace-expansion@5.0.8
  - postcss@8.5.23
  - brace-expansion@5.0.9
  - brace-expansion@1.1.18
  - js-yaml@3.15.1
  - js-yaml@4.3.1
  - postcss@8.5.18
