syntax = "proto3";

package pulsarchain.keyregistry.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "pulsarchain/keyregistry/v1/params.proto";
import "pulsarchain/common/validator_entry.proto";
import "pulsarchain/keyregistry/v1/registered_validator_set_entry.proto";

option go_package = "github.com/node101-io/pulsar-chain/x/keyregistry/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/keyregistry/v1/params";
  }

  // GetUserMinaPublicKey Queries a list of GetUserMinaPublicKey items.
  rpc GetUserMinaPublicKey(QueryGetUserMinaPublicKeyRequest) returns (QueryGetUserMinaPublicKeyResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/keyregistry/v1/get_user_mina_public_key/{user_cosmos_public_key}";
  }

  // GetUserCosmosPublicKey Queries a list of GetUserCosmosPublicKey items.
  rpc GetUserCosmosPublicKey(QueryGetUserCosmosPublicKeyRequest) returns (QueryGetUserCosmosPublicKeyResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/keyregistry/v1/get_user_cosmos_public_key/{user_mina_public_key}";
  }

  // GetValidatorMinaPubKey Queries a list of GetValidatorMinaPubKey items.
  rpc GetValidatorMinaPubKey(QueryGetValidatorMinaPubKeyRequest) returns (QueryGetValidatorMinaPubKeyResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/keyregistry/v1/get_validator_mina_pub_key/{validator_cosmos_pub_key}";
  }

  // GetValidatorCosmosPubKey Queries a list of GetValidatorCosmosPubKey items.
  rpc GetValidatorCosmosPubKey(QueryGetValidatorCosmosPubKeyRequest) returns (QueryGetValidatorCosmosPubKeyResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/keyregistry/v1/get_validator_cosmos_pub_key/{validator_mina_pub_key}";
  }

  // GetValidatorSetWithMinaKeys returns the supplied validator set with each validator's registered Mina public key.
  rpc GetValidatorSetWithMinaKeys(QueryGetValidatorSetWithMinaKeysRequest) returns (QueryGetValidatorSetWithMinaKeysResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/keyregistry/v1/get_validator_set_with_mina_keys";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryGetUserMinaPublicKeyRequest defines the QueryGetUserMinaPublicKeyRequest message.
message QueryGetUserMinaPublicKeyRequest {
  bytes user_cosmos_public_key = 1;
}

// QueryGetUserMinaPublicKeyResponse defines the QueryGetUserMinaPublicKeyResponse message.
message QueryGetUserMinaPublicKeyResponse {
  bytes user_mina_public_key = 1;
}

// QueryGetUserCosmosPublicKeyRequest defines the QueryGetUserCosmosPublicKeyRequest message.
message QueryGetUserCosmosPublicKeyRequest {
  bytes user_mina_public_key = 1;
}

// QueryGetUserCosmosPublicKeyResponse defines the QueryGetUserCosmosPublicKeyResponse message.
message QueryGetUserCosmosPublicKeyResponse {
  bytes user_cosmos_public_key = 1;
}

// QueryGetValidatorMinaPubKeyRequest defines the QueryGetValidatorMinaPubKeyRequest message.
message QueryGetValidatorMinaPubKeyRequest {
  bytes validator_cosmos_pub_key = 1;
}

// QueryGetValidatorMinaPubKeyResponse defines the QueryGetValidatorMinaPubKeyResponse message.
message QueryGetValidatorMinaPubKeyResponse {
  bytes validator_mina_pub_key = 1;
}

// QueryGetValidatorCosmosPubKeyRequest defines the QueryGetValidatorCosmosPubKeyRequest message.
message QueryGetValidatorCosmosPubKeyRequest {
  bytes validator_mina_pub_key = 1;
}

// QueryGetValidatorCosmosPubKeyResponse defines the QueryGetValidatorCosmosPubKeyResponse message.
message QueryGetValidatorCosmosPubKeyResponse {
  bytes validator_cosmos_pub_key = 1;
}

// QueryGetValidatorSetWithMinaKeysRequest defines the request for GetValidatorSetWithMinaKeys.
message QueryGetValidatorSetWithMinaKeysRequest {
  repeated pulsarchain.common.ValidatorEntry validators = 1;
}

// QueryGetValidatorSetWithMinaKeysResponse defines the response for GetValidatorSetWithMinaKeys.
message QueryGetValidatorSetWithMinaKeysResponse {
  repeated RegisteredValidatorSetEntry registered_validators = 1;
}
