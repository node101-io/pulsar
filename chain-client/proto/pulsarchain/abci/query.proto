syntax = "proto3";

package pulsarchain.abci;

import "google/api/annotations.proto";
import "pulsarchain/common/validator_entry.proto";
import "pulsarchain/votepersistence/v1/vote_ext_body.proto";

option go_package = "github.com/node101-io/pulsar-chain/abci;abci";

// Query defines the ABCI proof-related gRPC query service.
service Query {
  rpc GetValidatorSetWithPowers(QueryGetValidatorSetWithPowersRequest) returns (QueryGetValidatorSetWithPowersResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/abci/v1/validator_set_with_powers/{block_height}";
  }

  // VoteExtBodyByHeight queries the vote extension body for a vote-extension
  // consensus height.
  rpc VoteExtBodyByHeight(QueryVoteExtBodyByHeightRequest) returns (QueryVoteExtBodyByHeightResponse) {
    option (google.api.http).get = "/node101-io/pulsar-chain/abci/v1/vote_ext_body_by_height/{vote_extension_height}";
  }
}

// QueryVoteExtBodyByHeightRequest defines the request for VoteExtBodyByHeight.
message QueryVoteExtBodyByHeightRequest {
  // vote_extension_height is the consensus height N where the vote extension is
  // produced. The returned body signs the transition from state N-2 to state N-1.
  int64 vote_extension_height = 1;
}

// QueryVoteExtBodyByHeightResponse defines the response for VoteExtBodyByHeight.
message QueryVoteExtBodyByHeightResponse {
  pulsarchain.votepersistence.v1.VoteExtBody vote_ext_body = 1;
}

message QueryGetValidatorSetWithPowersRequest {
  int64 block_height = 1;
}

message QueryGetValidatorSetWithPowersResponse {
  repeated pulsarchain.common.ValidatorEntry validators = 1;
}
