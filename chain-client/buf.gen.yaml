# Generates TypeScript types for the pulsar-chain gRPC messages straight from
# the ../pulsar-chain SUBMODULE working tree (no vendored copy). The generated
# codecs ARE the transport — nothing parses a .proto at runtime — so a build
# that skipped this step keeps decoding with the previous field types instead
# of failing.
#
# Run:      pnpm run proto:gen   (buf CLI; network only to warm the BSR dep
#           cache the first time)
# Update:   check out the desired ref in ../pulsar-chain — the submodule
#           gitlink is the pin — and rerun. Uncommitted submodule changes are
#           generated from too, which is deliberate: chain-side proto patches
#           can be tried against the bridge before they land upstream.
version: v2
clean: true
inputs:
  # Upstream cosmos-sdk tendermint query service (GetLatestBlock,
  # GetValidatorSetByHeight, ...), which pulsar-chain depends on but does not
  # contain. The chain encodes its responses with the cosmos-sdk version IT
  # was built against, so this commit MUST equal the one in the submodule's
  # buf.lock — protoPins.test.ts fails on drift, because src/generated is
  # gitignored and a mismatched pin would silently reshape the
  # cosmos/tendermint codecs (including the Any-encoded Validator.pub_key
  # that validatorSet.ts slices at fixed offsets). Listed first so
  # pulsar-chain's pinned copies of shared well-known types win on overlap.
  - module: buf.build/cosmos/cosmos-sdk:65fa41963e6a41dd95a35934239029df
    paths:
      - cosmos/base/tendermint/v1beta1
  # pulsar-chain's own protos (abci, bridge, keyregistry, votepersistence, ...).
  - directory: ../pulsar-chain
    paths:
      - ../pulsar-chain/proto/pulsarchain
plugins:
  # Local ts-proto (exact devDependency pin) — regeneration is deterministic:
  # the submodule gitlink, the BSR pin above, and the pinned ts-proto version
  # decide the output.
  - local: protoc-gen-ts_proto
    out: src/generated
    include_imports: true
    opt:
      # Full output: message codecs + typed grpc-js service clients. The
      # generated clients ARE the transport — no proto parsing at runtime.
      - outputServices=grpc-js
      - snakeToCamel=false
      - forceLong=string
      # Responses may omit unset fields; force null-safe access.
      - useOptionals=all
      - esModuleInterop=true
      # Emit .js extensions on relative imports (required by nodenext resolution).
      - importSuffix=.js
