# Generates TypeScript types for the pulsar-chain gRPC messages from the
# VENDORED proto tree (./proto — the same files the runtime transport loads
# via @grpc/proto-loader, so types and wire behavior share one source).
#
# Run:      pnpm run proto:gen        (requires the buf CLI; no network)
# Update:   bump the pinned chain commit in scripts/vendor-protos.sh, run
#           `pnpm run proto:vendor && pnpm run proto:gen`, and commit the
#           proto/** + src/generated/** diff — chain-side proto changes then
#           show up as a reviewable diff / compile error.
version: v2
clean: true
inputs:
  - directory: proto
    paths:
      - proto/pulsarchain
      # Upstream tendermint query service too, so its message shapes are
      # generated instead of hand-mirrored in src.
      - proto/cosmos/base/tendermint/v1beta1
plugins:
  # Local ts-proto (exact devDependency pin) — regeneration is deterministic
  # and fully offline: only the vendored protos and the pinned ts-proto
  # version decide the output.
  - local: protoc-gen-ts_proto
    out: src/generated
    include_imports: true
    opt:
      # Full output: message codecs + typed grpc-js service clients. The
      # generated clients ARE the transport — no proto parsing at runtime.
      - outputServices=grpc-js
      - snakeToCamel=false
      - forceLong=string
      # Responses may omit unset fields; force null-safe access.
      - useOptionals=all
      - esModuleInterop=true
      # Emit .js extensions on relative imports (required by nodenext resolution).
      - importSuffix=.js
